<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>my calculator</title>
  <style>
  					button{
  					  background-color:black;
  					   color:white;
  					  width:40px;
  					  height:40px;
  					  border-radius:10px;
  					}
  
  #delBtn{
    background-color:red;
    width:90px;
  }
  
  button:nth-child(5){
    background-color:green;
  }
  
  </style>
</head>
<body>
  <button>1</button>
   <button>2</button>
   <button>3</button>
 		 <button>4</button>
		 		<button>5</button>
				 <button>6</button>
			 <button>7</button>
			 <button>8</button>
				 <button>9</button>
			 <button>0</button>  
  <button id="delBtn">DEL</button>
</body>
</html>
